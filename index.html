<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Apply the stored theme before first paint. Without this, React has to
         mount before <html> gets .dark, so dark-mode users get a light flash on
         every hard reload. See docs/adr/0005-theme-context-localstorage.md */
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* private mode / storage disabled — fall back to the light default */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f4fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0520" />
    <meta
      name="description"
      content="Setup Builder — build, price and compare PC setups, then share them with the community."
    />
    <meta property="og:title" content="Setup Builder" />
    <meta property="og:description" content="Build. Compare. Share. Price out your next PC build and share it with the community." />
    <meta property="og:type" content="website" />
    <title>Setup Builder — Build. Compare. Share.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
